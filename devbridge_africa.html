function t(k){return (copy[lang]&&copy[lang][k])||copy.en[k]||k}function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function inCommunity(x){return community==='both'||x==='both'||x===community}function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function jobCard(j){return `<article class="card job"><div class="company-logo">${esc(j.initial)}</div><div class="job-body"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(j.title)}</h3>${j.featured?'<span class="pill">✦ Featured</span>':''}</div><div class="company">${esc(j.company)} · ${esc(j.countries.join(', '))}</div><div class="job-meta"><span class="tag">${esc(j.type)}</span><span class="tag">${esc(j.mode)}</span><span class="tag">${esc(j.languages.join(' / '))}</span><span class="tag">${esc(j.level)}</span>${j.skills.slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="job-bottom"><span class="salary">${esc(j.salary)}</span><div class="job-actions"><button class="btn secondary small" onclick="toggleSave(${j.id})">${savedIds.has(j.id)?'★ '+t('savedBtn'):'☆ '+t('save')}</button><button class="btn small" onclick="applyJob(${j.id})">${t('apply')}</button></div></div></div></article>`}
function filteredJobs(){return jobs.filter(j=>inCommunity(j.community)&&(!filterText||[j.title,j.company,j.desc,...j.skills,...j.countries].join(' ').toLowerCase().includes(filterText.toLowerCase()))&&(typeFilter==='all'||j.type===typeFilter)&&(modeFilter==='all'||j.mode===modeFilter)&&(stackFilter==='all'||j.skills.some(s=>s.toLowerCase().includes(stackFilter.toLowerCase()))))}
function jobsMarkup(compact=false){let arr=filteredJobs();return `<div class="filters"><input class="search" id="jobSearch" placeholder="${t('search')}" value="${esc(filterText)}" oninput="filterText=this.value;refreshJobs()"><select id="typeFilter" onchange="typeFilter=this.value;refreshJobs()"><option value="all">${t('allTypes')}</option>${['Full-time','Freelance','Internship','Contract'].map(x=>`<option ${typeFilter===x?'selected':''}>${x}</option>`).join('')}</select><select id="modeFilter" onchange="modeFilter=this.value;refreshJobs()"><option value="all">${t('allModes')}</option>${['Remote','Hybrid','On-site'].map(x=>`<option ${modeFilter===x?'selected':''}>${x}</option>`).join('')}</select><select id="stackFilter" onchange="stackFilter=this.value;refreshJobs()"><option value="all">${t('stack')}: ${t('all')}</option>${['React','Laravel','Flutter','Python','Node.js','Data'].map(x=>`<option ${stackFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="job-list">${arr.length?arr.slice(0,compact?3:20).map(jobCard).join(''):`<div class="card empty">${t('noJobs')}</div>`}</div>`}
function rightWidgets(){return `<section class="card widget"><h3>${t('suggested')}</h3>${mentors.slice(0,3).map((m,i)=>`<div class="mentor"><div class="avatar">${m.initial}</div><div class="mentor-info"><strong>${m.name}</strong><span>${m.role}</span><span>${m.langs}</span></div></div>`).join('')}<button class="textbtn" onclick="setView('mentors')">${t('seeMentors')} →</button></section><section class="card widget"><h3>${t('upcoming')}</h3><div class="event"><div class="datebox">OCT<b>22</b></div><div><strong>Bilingual portfolio clinic</strong><span>Online · English / Français</span></div></div><div class="event"><div class="datebox">OCT<b>26</b></div><div><strong>Build in public: demo night</strong><span>Douala + online</span></div></div><button class="textbtn" onclick="toast('Events calendar opened in this demo.')">${t('join')} →</button></section><section class="card widget"><h3>${t('popular')}</h3><div class="skill-chips"><span class="tag">#React</span><span class="tag">#Laravel</span><span class="tag">#Flutter</span><span class="tag">#RemoteWork</span><span class="tag">#OpenSource</span><span class="tag">#IA / AI</span></div></section>`}
function dashboard(){return `<div class="welcome"><div><h1>${t('hello')}</h1><p>${t('subtitle')}</p></div><span class="pill">● ${community==='anglo'?t('anglo'):community==='franco'?t('franco'):t('both')}</span></div><section class="hero"><h2>${t('heroTitle')}</h2><p>${t('heroText')}</p><div class="hero-actions"><button class="btn" onclick="setView('jobs')">${t('explore')} ↗</button><button class="btn secondary" onclick="setView('profile')">${t('complete')}</button></div></section><div class="stats"><section class="card stat"><span class="label">${t('activeJobs')}</span><strong>${filteredJobs().length+24}</strong><small>↗ 12 this week</small></section><section class="card stat"><span class="label">${t('mentorsOnline')}</span><strong>38</strong><small><span class="online"></span> 6 available now</small></section><section class="card stat"><span class="label">${t('communityMembers')}</span><strong>2.4k</strong><small>Across 12 countries</small></section></div><div class="section-head"><h2>${t('featured')}</h2><button class="textbtn" onclick="setView('jobs')">${t('viewAll')} →</button></div>${jobsMarkup(true)}<div class="section-head"><h2>${t('communityTitle')}</h2><button class="textbtn" onclick="setView('community')">${t('viewAll')} →</button></div>${posts.filter(p=>inCommunity(p.community)).slice(0,1).map(postCard).join('')}`}
function postCard(p){return `<article class="card post"><div class="post-top"><div class="avatar">${esc(p.initial)}</div><div class="who"><strong>${esc(p.name)} <span class="tag">${p.community==='both'?'Cross-community':''}</span></strong><span>${esc(p.role)} · ${esc(p.time)} ago</span></div><button class="iconbtn" onclick="toast('Post options')">•••</button></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="skill-chips" style="margin:0 0 13px"><span class="tag">#${esc(p.topic)}</span></div><div class="post-actions"><button class="${postsLikes.has(p.id)?'liked':''}" onclick="likePost(${p.id})">♡ ${p.likes+(postsLikes.has(p.id)?1:0)} ${t('liked')}</button><button onclick="toast('Comments opened in this demo.')">◌ ${p.comments} comments</button><button onclick="toast(t('toastSaved'))">☆ ${t('save')}</button></div></article>`}
function communityPage(){return `<div class="welcome"><div><h1>${t('communityTitle')}</h1><p>${t('communityNote')}</p></div></div><div class="community-tabs"><button class="${community==='anglo'?'selected':''}" onclick="switchCommunity('anglo')">🇬🇧 English-first</button><button class="${community==='franco'?'selected':''}" onclick="switchCommunity('franco')">🇫🇷 Français</button><button class="${community==='both'?'selected':''}" onclick="switchCommunity('both')">🌍 Cross-community</button></div><section class="card post-compose"><div class="compose-row"><div class="avatar">${esc((userProfile.name||'A').slice(0,2).toUpperCase())}</div><input id="quickPost" placeholder="${t('share')}"><button class="btn" onclick="openModal('post')">＋</button></div></section>${posts.filter(p=>inCommunity(p.community)).map(postCard).join('')||'<div class="card empty">No posts yet. Start the conversation.</div>'}`}
function profilePage(){return `<div class="welcome"><div><h1>${t('profileTitle')}</h1><p>${t('profileText')}</p></div><span class="pill">Profile strength · 72%</span></div><section class="card profile-card"><div class="profile-top"><div class="profile-avatar">${esc((userProfile.name||'A').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</div><div><h2>${esc(userProfile.name)}</h2><p>${esc(userProfile.headline)}</p><span class="pill">✓ Community member</span></div></div><form class="profile-grid" id="profileForm"><div class="field"><label>${t('name')}</label><input name="name" value="${esc(userProfile.name)}" required></div><div class="field"><label>${t('city')}</label><input name="city" value="${esc(userProfile.city)}"></div><div class="field full"><label>${t('headline')}</label><input name="headline" value="${esc(userProfile.headline)}"></div><div class="field full"><label>${t('bio')}</label><textarea name="bio">${esc(userProfile.bio)}</textarea></div><div class="field"><label>${t('github')}</label><input name="github" value="${esc(userProfile.github)}"></div><div class="field"><label>${t('portfolio')}</label><input name="portfolio" value="${esc(userProfile.portfolio)}"></div><div class="field full"><label>${t('skills')}</label><input name="skills" value="${esc(userProfile.skills)}"></div><div class="field"><label>${t('workPref')}</label><select name="work"><option value="remote" ${userProfile.work==='remote'?'selected':''}>Remote</option><option value="local" ${userProfile.work==='local'?'selected':''}>Local / hybrid</option><option value="any" ${userProfile.work==='any'?'selected':''}>Any</option></select></div><div class="field"><label>${t('openWork')}</label><select name="open"><option value="yes" ${userProfile.open?'selected':''}>Yes</option><option value="no" ${!userProfile.open?'selected':''}>Not currently</option></select></div><div class="field full"><button class="btn" type="submit">${t('saveProfile')}</button></div></form></section><div class="section-head"><h2>Skills you’re showcasing</h2></div><div class="skill-chips">${userProfile.skills.split(',').map(s=>`<span class="tag">${esc(s.trim())}</span>`).join('')}<span class="tag">+ Add skill</span></div>`}
function mentorsPage(){return `<div class="welcome"><div><h1>${t('mentorTitle')}</h1><p>${t('mentorText')}</p></div></div><div class="job-list">${mentors.map((m,i)=>`<section class="card widget"><div class="profile-top"><div class="avatar" style="width:55px;height:55px">${m.initial}</div><div style="flex:1"><h2 style="font-size:16px;margin:0">${m.name} <span class="pill">✓ Experience</span></h2><p style="margin:3px 0;color:var(--muted)">${m.role}</p><span style="font-size:12px;color:var(--muted)">${m.langs}</span></div><strong>${m.rate}<small style="display:block;font-size:10px;color:var(--muted)">${t('rate')}</small></strong></div><div class="skill-chips"><span class="tag">${m.skills}</span><span class="tag">Career roadmap</span><span class="tag">Portfolio review</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><span style="font-size:12px;color:var(--muted)">⭐ ${(4.8+i*.1).toFixed(1)} · ${12+i*8} reviews</span><button class="btn small" onclick="requestMentor(${i})">${t('book')}</button></div></section>`).join('')}<section class="card widget"><h3>${t('office')}</h3><p style="color:var(--muted)">Join a free community session to ask questions, meet peers, and get unstuck.</p><button class="btn secondary" onclick="toast('You are on the office-hours interest list in this demo.')">Reserve a free spot</button></section></div>`}
function projectsPage(){return `<div class="welcome"><div><h1>${t('projectsTitle')}</h1><p>${t('projectsText')}</p></div><button class="btn" onclick="openModal('project')">＋ ${t('startProject')}</button></div><div class="job-list">${projects.map(p=>`<section class="card widget"><div style="display:flex;justify-content:space-between;gap:10px"><h3 style="margin:0">${esc(p.name)}</h3><span class="pill">Recruiting</span></div><p style="color:var(--muted)">${esc(p.desc)}</p><div class="skill-chips">${p.stack.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="section-head" style="margin-bottom:0"><span style="font-size:12px;color:var(--muted)">👥 ${p.people} contributors · Seeking ${p.roles.join(', ')}</span><button class="btn small" onclick="toast('Interest sent to the project owner in this demo.')">Join project</button></div></section>`).join('')}</div>`}
function reviewsPage(){return `<div class="welcome"><div><h1>${t('reviewsTitle')}</h1><p>${t('reviewsText')}</p></div></div><section class="card profile-card"><h3>What kind of feedback do you need?</h3><p style="color:var(--muted)">Choose a focused review. Never submit passwords, API keys, tokens, or private customer data.</p><div class="skill-chips"><span class="tag">Architecture</span><span class="tag">Security</span><span class="tag">Performance</span><span class="tag">Code quality</span><span class="tag">Interview readiness</span></div><button class="btn" style="margin-top:18px" onclick="openModal('review')">${t('requestReview')}</button></section><div class="section-head"><h2>How it works</h2></div><div class="job-list"><section class="card widget"><h3>01 · Share a repository</h3><p style="color:var(--muted)">Link a public GitHub repo or submit a small code snippet.</p></section><section class="card widget"><h3>02 · Pick your focus</h3><p style="color:var(--muted)">Choose the feedback you need and the language you prefer.</p></section><section class="card widget"><h3>03 · Get prioritized feedback</h3><p style="color:var(--muted)">Receive practical next steps from a peer or experienced reviewer.</p></section></div>`}
function savedPage(){let arr=jobs.filter(j=>savedIds.has(j.id));return `<div class="welcome"><div><h1>${t('savedTitle')}</h1><p>Keep track of roles you may want to apply for.</p></div></div>${arr.length?`<div class="job-list">${arr.map(jobCard).join('')}</div>`:`<section class="card empty"><div style="font-size:35px">☆</div><p>${t('noSaved')}</p><button class="btn" onclick="setView('jobs')">${t('explore')}</button></section>`}`}
function render(){document.getElementById('mainContent').innerHTML=({dashboard, jobs:()=>`<div class="welcome"><div><h1>${t('jobsTitle')}</h1><p>${t('jobsText')}</p></div><button class="btn" onclick="openModal('job')">＋ ${t('postJob')}</button></div>${jobsMarkup()}`,community:communityPage,profile:profilePage,mentors:mentorsPage,projects:projectsPage,reviews:reviewsPage,saved:savedPage}[view]||dashboard)();document.getElementById('rightContent').innerHTML=rightWidgets();document.getElementById('topNav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.side-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.getElementById('communityTitle').textContent=community==='anglo'?t('anglo'):community==='franco'?t('franco'):t('both');document.getElementById('communityDesc').textContent=community==='anglo'?'English-first community · open borders':community==='franco'?'Communauté francophone · ouverte sur le monde':'Shared opportunities · deux communautés';let form=document.getElementById('profileForm');if(form)form.onsubmit=e=>{e.preventDefault();let d=new FormData(form);userProfile={...userProfile,name:d.get('name'),city:d.get('city'),headline:d.get('headline'),bio:d.get('bio'),github:d.get('github'),portfolio:d.get('portfolio'),skills:d.get('skills'),work:d.get('work'),open:d.get('open')==='yes'};toast(t('profileSaved'));render()}}
function refreshJobs(){let search=document.getElementById('jobSearch');let tf=document.getElementById('typeFilter'),mf=document.getElementById('modeFilter'),sf=document.getElementById('stackFilter');if(search)filterText=search.value;if(tf)typeFilter=tf.value;if(mf)modeFilter=mf.value;if(sf)stackFilter=sf.value;let container=document.querySelector('.filters')?.nextElementSibling;if(container)container.outerHTML=`<div class="job-list">${filteredJobs().length?filteredJobs().slice(0,view==='dashboard'?3:20).map(jobCard).join(''):`<div class="card empty">${t('noJobs')}</div>`}</div>`}
function toggleSave(id){savedIds.has(id)?savedIds.delete(id):savedIds.add(id);toast(savedIds.has(id)?t('toastSaved'):'Removed from saved');render()}function applyJob(id){if(appliedIds.has(id)){toast(t('alreadyApplied'));return}appliedIds.add(id);toast(t('applied')+' '+t('applyInfo'))}function likePost(id){postsLikes.has(id)?postsLikes.delete(id):postsLikes.add(id);render()}function switchCommunity(c){community=c;render()}function requestMentor(i){openModal('mentor',i)}
const modalBackdrop=document.getElementById('modalBackdrop');let modalType='';function openModal(type,idx){modalType=type;let title='',body='';if(type==='job'){title=t('postJob');body=`<form class="modal-form" id="modalForm"><div><label>${t('jobTitle')}</label><input name="title" required placeholder="e.g. Full-stack Developer"></div><div><label>${t('company')}</label><input name="company" required></div><div><label>${t('description')}</label><textarea name="desc" required></textarea></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>${t('type')}</label><select name="type"><option>Full-time</option><option>Freelance</option><option>Internship</option><option>Contract</option></select></div><div><label>${t('workMode')}</label><select name="mode"><option>Remote</option><option>Hybrid</option><option>On-site</option></select></div></div><div><label>${t('requiredSkills')}</label><input name="skills" placeholder="React, TypeScript"></div><div><label>${t('salary')}</label><input name="salary" placeholder="Optional"></div><div><label>${t('languageReq')}</label><select name="language"><option>English</option><option>French</option><option>English and French</option></select></div><div><label>${t('communitySwitch')}</label><select name="community"><option value="${community}">${community==='anglo'?'Anglophone':community==='franco'?'Francophone':'Both'}</option><option value="both">Both communities</option><option value="anglo">Anglophone</option><option value="franco">Francophone</option></select></div></form>`}else if(type==='post'){title=t('postCommunity');body=`<form class="modal-form" id="modalForm"><div><label>${t('postTitle')}</label><input name="title" required></div><div><label>${t('postBody')}</label><textarea name="body" required></textarea></div><div><label>${t('topic')}</label><select name="topic"><option>Career growth</option><option>Code review</option><option>Jobs</option><option>Open source</option><option>Events</option></select></div><div><label>${t('communitySwitch')}</label><select name="community"><option value="${community}">Current community</option><option value="both">Cross-community</option><option value="anglo">Anglophone Africa</option><option value="franco">Francophone Africa</option></select></div></form>`}else if(type==='review'){title=t('requestReview');body=`<form class="modal-form" id="modalForm"><div><label>${t('repository')}</label><input name="repo" type="url" placeholder="https://github.com/you/project" required></div><div><label>${t('reviewType')}</label><select name="kind"><option>Code quality</option><option>Architecture</option><option>Security</option><option>Performance</option><option>Interview readiness</option><option>Bug fixing</option></select></div><div><label>${t('reviewLang')}</label><select name="language"><option>English</option><option>French</option><option>Bilingual</option></select></div><div><label>What should the reviewer focus on?</label><textarea name="notes" placeholder="Context, goals, and specific questions"></textarea></div></form>`}else if(type==='project'){title=t('startProject');body=`<form class="modal-form" id="modalForm"><div><label>${t('projectName')}</label><input name="name" required></div><div><label>${t('projectDesc')}</label><textarea name="desc" required></textarea></div><div><label>${t('skills')}</label><input name="stack" placeholder="React, Python, Flutter"></div><div><label>${t('roles')}</label><input name="roles" placeholder="Frontend, UX, backend"></div></form>`}else if(type==='mentor'){let m=mentors[idx];title=t('book')+' · '+m.name;body=`<p style="color:var(--muted)">${m.role} · ${m.langs}</p><form class="modal-form" id="modalForm"><div><label>What would you like help with?</label><select name="topic"><option>Career roadmap</option><option>Portfolio review</option><option>Mock interview</option><option>System design</option><option>Code review</option></select></div><div><label>Preferred time</label><input name="time" type="datetime-local" required></div><div><label>Context / goals</label><textarea name="notes"></textarea></div></form>`}document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('saveModal').textContent=type==='post'?t('post'):t('create');modalBackdrop.classList.add('show');document.getElementById('saveModal').onclick=saveModal}
function closeModal(){modalBackdrop.classList.remove('show')}function saveModal(){let form=document.getElementById('modalForm');if(!form||!form.reportValidity())return;let d=new FormData(form);if(modalType==='job'){let skill=(d.get('skills')||'').split(',').map(x=>x.trim()).filter(Boolean);jobs.unshift({id:Date.now(),company:d.get('company'),initial:d.get('company').slice(0,1).toUpperCase(),title:d.get('title'),desc:d.get('desc'),type:d.get('type'),mode:d.get('mode'),countries:['All Africa'],languages:[d.get('language')],skills:skill,level:'Any',salary:d.get('salary')||'Compensation discussed',community:d.get('community'),featured:false});toast(t('jobPosted'))}else if(modalType==='post'){posts.unshift({id:Date.now(),name:userProfile.name||'You',initial:(userProfile.name||'Y').slice(0,2).toUpperCase(),role:userProfile.headline||'Developer',time:'now',community:d.get('community'),title:d.get('title'),body:d.get('body'),topic:d.get('topic'),likes:0,comments:0});toast(t('postShared'))}else if(modalType==='review'){toast(t('reviewSent')+' Keep private credentials out of submitted code.')}else if(modalType==='project'){projects.unshift({name:d.get('name'),desc:d.get('desc'),stack:(d.get('stack')||'').split(',').map(x=>x.trim()).filter(Boolean),roles:(d.get('roles')||'Collaborators').split(',').map(x=>x.trim()).filter(Boolean),people:1});toast(t('projectAdded'))}else if(modalType==='mentor'){toast('Session request recorded in this demo. No payment or booking was made.')}closeModal();render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.getElementById('language').addEventListener('change',e=>{lang=e.target.value;document.documentElement.lang=lang;render()});document.getElementById('postJobBtn').addEventListener('click',()=>openModal('job'));document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('cancelModal').addEventListener('click',closeModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
